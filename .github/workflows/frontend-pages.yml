name: Deploy frontend to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
        working-directory: frontend
      - run: npm run test && npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          # No backend is hosted yet. Ship in explicit demo mode until a real
          # VITE_API_BASE_URL repo variable is configured for a deployed backend;
          # set VITE_DEMO_MODE=false as a repo variable once that exists.
          VITE_DEMO_MODE: ${{ vars.VITE_DEMO_MODE || 'true' }}
          # Enable only after deploying/configuring the protected shared backend.
          VITE_SHARED_MODE: ${{ vars.VITE_SHARED_MODE || 'false' }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: frontend/dist}
      - id: deployment
        uses: actions/deploy-pages@v4
